name: build

on: [push, pull_request, workflow_dispatch]

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  IMAGE_NAME: spongepowered/spongedocs

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      branch: ${{ steps.variables.outputs.branch }}
      version: ${{ steps.variables.outputs.version }}
      versions: ${{ steps.variables.outputs.versions }}

    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: 3.x
        cache: 'pip'

    - name: Install Python dependencies
      run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

    - name: Test build
      run: sphinx-build -W -d build/doctrees source build/html

    - name: Build translation files
      run: sphinx-build -W -q -b gettext source build/locale

    - name: Set crowdin branch
      id: variables
      if: github.ref_name == 'stable' || startsWith(github.ref_name, 'release-') || github.ref_name == 'dev'
      run: |
        echo "Ref: $GITHUB_REF"
        BRANCH=${GITHUB_REF##*/}
        echo "Branch: $BRANCH"
        echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
        VERSION="${BRANCH##*-}"
        echo "Current Version: $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        VERSIONS=$(list-versions)
        echo "Available Versions: $VERSIONS"
        echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"
      env:
        GITHUB_USER: ${{ github.actor }}
        GITHUB_TOKEN: ${{ github.token }}
    - name: Upload to crowdin
      uses: crowdin/github-action@8868a33591d21088edfc398968173a3b98d51706 # v2.16.2
      if: github.ref_name == 'stable' || startsWith(github.ref_name, 'release-')
      with:
        crowdin_branch_name: ${{ steps.variables.outputs.version }}
        config: 'crowdin.yaml'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
        CROWDIN_TOKEN: ${{ secrets.CROWDIN_TOKEN }}
        CROWDIN_BASE_URL: https://spongepowered.crowdin.com

  publish-docker:
    runs-on: ubuntu-latest
    if: github.ref_name == 'stable' || startsWith(github.ref_name, 'release-') || github.ref_name == 'dev'
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Login to Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name == 'dev' && 'dev-stable' || needs.build.outputs.version }}
          build-args: |
            GITHUB_USER=SpongePowered
            GITHUB_TOKEN=${{ github.token }}
            GITHUB_REPO=SpongeDocs
            GITHUB_VERSION=${{ needs.build.outputs.branch }}
            CROWDIN_TOKEN=${{ secrets.CROWDIN_TOKEN }}
            CROWDIN_PROJECT_ID=${{ secrets.CROWDIN_PROJECT_ID }}
            CROWDIN_BASE_URL=https://spongepowered.crowdin.com
            VERSION=${{ github.ref_name == 'dev' && 'stable' || needs.build.outputs.version }}

  publish-docker-all:
    runs-on: ubuntu-latest
    needs: [build, publish-docker]
    if: |
      !cancelled() &&
      needs.build.result == 'success' &&
      (needs.publish-docker.result == 'success' || needs.publish-docker.result == 'skipped') &&
      (github.ref_name == 'stable' || github.ref_name == 'dev')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate Dockerfile
        run: ./deployment/generate-dockerfile.sh
        env:
          GITHUB_USER: SpongePowered
          GITHUB_TOKEN: ${{ github.token }}
          VERSIONS: ${{ needs.build.outputs.versions }}
          ACTIVE_VERSION: ${{ github.ref_name == 'dev' && 'stable' || '' }}
          TAG_PREFIX: ${{ github.ref_name == 'dev' && 'dev-' || '' }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Login to Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name == 'dev' && 'dev-latest' || 'latest' }}
          context: .
          file: ./deployment/Dockerfile
